<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeautyGlow Cosmetics</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background-color: #fff;
      color: #333;
    }
    header {
      background-color: #f8d7da;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      color: #b56576;
    }
    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #333;
      font-weight: 500;
    }
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 60px 20px;
      background-color: #fcefee;
    }
    .hero-text {
      max-width: 400px;
    }
    .hero-text h2 {
      font-size: 2.5em;
      color: #b56576;
    }
    .hero-text p {
      font-size: 1.1em;
      margin-bottom: 20px;
    }
    .btn {
      background-color: #b56576;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      font-size: 1em;
    }
    .products {
      text-align: center;
      padding: 50px 20px;
    }
    .product-grid {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }
    .product {
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 20px;
      width: 200px;
      background-color: #fff;
    }
    .product img {
      width: 100%;
      border-radius: 10px;
    }
    footer {
      background-color: #f8d7da;
      text-align: center;
      padding: 20px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <header>
    <h1>BeautyGlow</h1>
    <nav>
      <a href="#">Shop</a>
      <a href="#">About</a>
      <a href="#">Blog</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h2>Radiant Beauty Awaits</h2>
      <p>Discover your perfect look with our cruelty-free cosmetics.</p>
      <button class="btn">Shop Now</button>
    </div>
    <img src="https://via.placeholder.com/400x300" alt="Cosmetic model" />
  </section>

  <section class="products">
    <h2>Best Sellers</h2>
    <div class="product-grid">
      <div class="product">
        <img src="https://via.placeholder.com/200" alt="Serum" />
        <h3>Luminous Glow Serum</h3>
        <p>$29.99</p>
        <button class="btn">Add to Cart</button>
      </div>
      <div class="product">
        <img src="https://via.placeholder.com/200" alt="Lipstick" />
        <h3>Velvet Lipstick</h3>
        <p>$18.00</p>
        <button class="btn">Add to Cart</button>
      </div>
      <div class="product">
        <img src="https://via.placeholder.com/200" alt="Cream" />
        <h3>Hydra Renewal Cream</h3>
        <p>$34.00</p>
        <button class="btn">Add to Cart</button>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2026 BeautyGlow Cosmetics | All rights reserved</p>
  </footer>
</body>
</html>
